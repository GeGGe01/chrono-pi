packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: true
  sharp: true
# Security overrides — force patched transitive versions past vulnerable ranges.
# Keep selectors constrained to the vulnerable spans so unrelated dependency
# resolution remains under the upstream packages' control.
overrides:
  'nanoid@<3.3.18': '^3.3.18'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'postcss@<8.5.23': '^8.5.23'
  'devalue@<5.9.2': '^5.9.2'
  'sharp@<0.35.4': '^0.35.4'
  'smol-toml@<=1.7.0': '^1.7.1'
  'svgo@>=4.0.0 <4.1.0': '^4.1.0'
  'fast-uri@>=3.0.0 <3.1.6': '^3.1.6'
