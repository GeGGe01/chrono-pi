name: Feature request
description: Propose a new feature, calendar, or reckoning
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or what does it add?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would the solution look like? For a new calendar or reckoning, name the convention and an attested source.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions considered

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribute
      options:
        - label: I am willing to submit a PR for this
